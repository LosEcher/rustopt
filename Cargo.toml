[package]
name = "rustopt"
version = "0.1.0"
edition = "2021"
# Verified: `cargo +1.87.0 check --offline --all-targets` passes, and CI pins the same
# version. Do not lower this without running that command.
rust-version = "1.87"
description = "Size-aware release-profile ablation and binary-size budget gates for Rust projects: plan a smaller artifact by actually building the variants, then fail the build when it grows past a budget."
license = "MIT"
repository = "https://github.com/LosEcher/rustopt"
keywords = ["binary-size", "profile", "lto", "strip", "ci"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# tests/cli.rs asserts on `--emit json` output.
serde_json = "1"

[[bin]]
name = "rustopt"
path = "src/main.rs"

[profile.release]
# rustopt measures size, so it must not hide it: this repo deliberately does NOT set
# `strip = "symbols"` here (that would make `cargo bloat`/`nm` useless on rustopt itself).
opt-level = "z"
lto = "fat"
codegen-units = 1

[profile.dev]
incremental = false
