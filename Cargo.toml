[package]
name = "rustopt"
version = "0.1.0"
edition = "2021"
# Verified: `cargo +1.87.0 check --offline --all-targets` passes, and CI pins the same
# version. Do not lower this without running that command.
rust-version = "1.87"
description = "Size-aware release-profile ablation and binary-size budget gates for Rust projects: plan a smaller artifact by actually building the variants, then fail the build when it grows past a budget."
license = "MIT"
repository = "https://github.com/LosEcher/rustopt"
keywords = ["binary-size", "profile", "lto", "strip", "ci"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# tests/cli.rs asserts on `--emit json` output.
serde_json = "1"

[[bin]]
name = "rustopt"
path = "src/main.rs"

# Two profiles on purpose, because artifact size and build time pull in opposite
# directions and the tool should not silently trade one for the other:
#
#   --release  (this profile is intentionally left as cargo's default)
#       used by developers and by the pull-request CI matrix. Nothing is overridden,
#       so `codegen-units = 16` keeps intra-crate parallelism and there is no LTO.
#       `cargo install rustopt` also lands here, so users get a fast local build.
#
#   --profile dist
#       used only when producing the published release assets. This is where the
#       size knobs live. Measured cost of these knobs on a comparable crate:
#       ~2x wall-clock (and worse on a loaded machine, because codegen-units = 1
#       removes the parallelism that lets a build absorb contention).
#
# The knobs are NOT in [profile.release]: rustopt measures size, and a tool whose own
# release builds are 2x slower for bytes it never ships would be a poor advertisement
# for its own advice.
[profile.dist]
inherits = "release" # required: cargo errors out on a custom profile without it
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
# Not set here either (and never recommended by `plan` for a crate that catches
# panics): panic = "abort" would break rustopt's own "exit 2 = tool error" contract,
# which is implemented with std::panic::catch_unwind in src/main.rs.

[profile.dev]
incremental = false

[profile.dev.package."*"]
# deps: no debuginfo (biggest dev-build disk lever; measured 372 -> 225 MB here).
debug = 0
# debug = 0 makes cargo pass `-C strip=debuginfo`; Apple strip can break proc-macro
# dylibs (dlopen: mis-aligned LINKEDIT string pool). Free insurance, no size cost.
strip = "none"
