name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned, not @stable: a new upstream clippy lint can turn main red on a day
          # nobody changed anything, and then local runs cannot reproduce it.
          # Bump the two pinned versions here together with `rust-version` in Cargo.toml.
          # (Written literally: an `env:` indirection did not reach the action input
          # on the Windows runner.)
          toolchain: "1.97.0"
          components: rustfmt, clippy
      # This job builds three dependency trees per platform (default, clippy, then
      # `--profile dist`), so without a cache every run pays for all of them.
      # Baseline before this commit: ubuntu 81s / macos 54s / windows 116s.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Packaging profile smoke build
        # The release job only runs on tags, so without this a broken `dist` profile
        # would only be discovered while trying to publish. One platform is enough.
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --locked --profile dist
      - name: Test
        # tests/cli.rs builds the fixture packages for real, so this also exercises
        # every documented exit code.
        run: cargo test --locked

  msrv:
    name: msrv (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check against the declared rust-version
        run: |
          declared=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$declared" != "1.87" ]; then
            echo "rust-version is $declared but this job pins 1.87.0; update both together"
            exit 1
          fi
          cargo check --locked --all-targets

  release:
    name: release (${{ matrix.asset }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, msrv]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Asset names follow the fixed `<tool>-<os>-<arch>` contract so the three
          # jobs can never overwrite each other's artifact.
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: rustopt-macos-arm64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: rustopt-linux-x86_64-musl
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: rustopt-windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # `--target <triple>` writes under target/<triple>, so the key must include
          # the triple or the three rows would share a single entry.
          key: ${{ matrix.target }}
      - name: Build
        # Shipped assets come from the `dist` profile (size knobs). The test matrix
        # above keeps plain `--release`, which stays fast because it is cargo's
        # default profile: only the tag-time packaging job pays for LTO.
        run: cargo build --locked --profile dist --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe";; esac
          mkdir -p dist
          cp "target/${{ matrix.target }}/dist/rustopt${ext}" "dist/${{ matrix.asset }}${ext}"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
