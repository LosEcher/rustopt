name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Test
        # tests/cli.rs builds the fixture packages for real, so this also exercises
        # every documented exit code.
        run: cargo test --locked

  msrv:
    name: msrv (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87.0"
      - name: Check against the declared rust-version
        run: |
          declared=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$declared" != "1.87" ]; then
            echo "rust-version is $declared but this job pins 1.87.0; update both together"
            exit 1
          fi
          cargo check --locked --all-targets

  release:
    name: release (${{ matrix.asset }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, msrv]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Asset names follow the fixed `<tool>-<os>-<arch>` contract so the three
          # jobs can never overwrite each other's artifact.
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: rustopt-macos-arm64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: rustopt-linux-x86_64-musl
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: rustopt-windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe";; esac
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/rustopt${ext}" "dist/${{ matrix.asset }}${ext}"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
