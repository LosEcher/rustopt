# miri-pure-core.conf — rustopt
#
# The pure core is arithmetic and planning: budget unit parsing/formatting,
# release-profile variant planning, FNV hashing for ledger keys, report
# rendering, and the measurement parser. A wrong multiplier or an off-by-one in
# the size plan is exactly the kind of silent defect this proves out.
#
# Excluded by measurement: `guard` (lstat), `ledger` (unlink), `events` (unlink).
MIRI_FILTERS=(budget:: variants:: fnv:: report:: measure::)
MIRI_MIN_PASSED=24
MIRI_TARGET=bins
